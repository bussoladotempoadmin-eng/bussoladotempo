<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Onboarding guiado — exemplo (Bússola do Tempo)</title>
<style>
  :root{
    --bg:#f1f5f9; --fg:#0f172a; --card:#fff; --muted:#64748b; --border:#e2e8f0;
    --primary:#2563eb; --primary-fg:#fff; --soft:#f8fafc;
    --importante:#10b981; --urgente:#ef4444; --disperso:#94a3b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#0b1220;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

  /* moldura de celular */
  .phone{position:relative;width:390px;max-width:100%;height:780px;max-height:94vh;background:var(--bg);border-radius:34px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);border:1px solid #1e293b}
  .screen{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* topo */
  header{position:sticky;top:0;z-index:5;background:rgba(241,245,249,.9);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
  .avatar{width:34px;height:34px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}

  .wrap{padding:18px 16px 96px}
  .hi{font-size:22px;font-weight:800;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);margin-bottom:14px}
  .label{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}

  .btn-ia{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--primary);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}

  .bloco{border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:14px;padding:12px;background:#fff;margin-bottom:12px}
  .bloco .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .time{font-family:ui-monospace,monospace;font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--border);padding:3px 8px;border-radius:8px}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .tag.imp{background:rgba(16,185,129,.14);color:#059669}
  .tit{font-weight:700;font-size:14px}
  .concluir{margin-top:4px;display:inline-flex;align-items:center;gap:6px;background:#ecfdf5;color:#059669;border:1px solid #a7f3d0;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;cursor:pointer}

  /* nav inferior */
  .nav{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--border);padding:8px 6px 12px}
  .nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--muted);text-decoration:none;font-weight:600;padding:4px 8px;border-radius:10px}
  .nav a .ic{font-size:18px}
  .nav a.on{color:var(--primary)}

  /* ===== TOUR ===== */
  #spot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(2,6,23,.72);transition:all .35s cubic-bezier(.4,0,.2,1);pointer-events:none;z-index:50;border:2px solid var(--primary)}
  #pop{position:fixed;z-index:51;width:270px;max-width:calc(100% - 24px);background:#fff;border-radius:16px;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35);transition:all .35s cubic-bezier(.4,0,.2,1)}
  #pop .step{font-size:11px;font-weight:800;color:var(--primary);letter-spacing:.04em}
  #pop h3{margin:6px 0 4px;font-size:17px}
  #pop p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.5}
  #pop .arrow{position:absolute;width:14px;height:14px;background:#fff;transform:rotate(45deg)}
  .dots{display:flex;gap:5px;margin-top:14px}
  .dots i{height:5px;flex:1;border-radius:999px;background:var(--border)}
  .dots i.on{background:var(--primary)}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .skip{background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer}
  .nextbtns{display:flex;gap:8px}
  .back{background:none;border:none;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;padding:8px}
  .next{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer}
  .hidden{display:none!important}

  .restart{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;background:#fff;color:var(--primary);border:1px solid var(--primary);border-radius:999px;padding:8px 16px;font-weight:700;font-size:13px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3)}
</style>
</head>
<body>

<div class="phone">
  <div class="screen" id="screen">
    <header>
      <div class="logo" id="t-logo">🧭 Bússola do Tempo</div>
      <div class="avatar" id="t-menu">L</div>
    </header>

    <div class="wrap">
      <div class="hi">Bom dia, Lucas 👋</div>
      <div class="sub">Segunda, 15 de junho</div>

      <button class="btn-ia" id="t-ia">✨ Montar minha semana com IA</button>

      <div class="card" style="margin-top:14px">
        <div class="label">Hoje · suas demandas</div>

        <div class="bloco" id="t-bloco">
          <div class="top">
            <span class="time">08:00–12:00</span>
            <span class="tag imp">🎯 Importante</span>
          </div>
          <div class="tit">Revisar pipeline + alinhar marketing</div>
          <button class="concluir" id="t-concluir">✓ Concluir</button>
        </div>

        <div class="bloco" style="border-left-color:#f97316">
          <div class="top">
            <span class="time">13:30–18:00</span>
            <span class="tag imp" style="background:rgba(249,115,22,.14);color:#ea580c">🎯 Importante</span>
          </div>
          <div class="tit">Mentoria ao vivo — aula 04</div>
        </div>
      </div>
    </div>

    <nav class="nav">
      <a class="on"><span class="ic">🏠</span>Hoje</a>
      <a id="t-semana"><span class="ic">🗓️</span>Semana</a>
      <a id="t-frentes"><span class="ic">🎯</span>Frentes</a>
      <a id="t-revisao"><span class="ic">🔄</span>Revisão</a>
      <a id="t-time"><span class="ic">👥</span>Time</a>
    </nav>
  </div>
</div>

<!-- tour -->
<div id="spot" class="hidden"></div>
<div id="pop" class="hidden">
  <span class="arrow" id="arrow"></span>
  <div class="step" id="stepLbl">Passo 1 de 6</div>
  <h3 id="popTitle">Título</h3>
  <p id="popText">Texto</p>
  <div class="dots" id="dots"></div>
  <div class="row">
    <button class="skip" id="skip">Pular tour</button>
    <div class="nextbtns">
      <button class="back" id="back">Voltar</button>
      <button class="next" id="next">Avançar</button>
    </div>
  </div>
</div>

<button class="restart hidden" id="restart">↻ Ver o tour de novo</button>

<script>
  const steps = [
    { sel:'#t-frentes', title:'1. Suas Frentes', text:'Comece por aqui: cadastre suas áreas de atuação (trabalho, negócio, estudos). Tudo na sua semana se organiza por elas.' },
    { sel:'#t-ia', title:'2. Montar com IA', text:'Com as frentes prontas, a IA monta sua semana inteira em segundos — você só ajusta o que quiser.' },
    { sel:'#t-bloco', title:'3. Suas demandas', text:'Cada bloco é uma demanda do dia, com horário, frente e categoria (importante, urgente ou disperso).' },
    { sel:'#t-concluir', title:'4. Concluir e dizer como foi', text:'Ao terminar, toque em Concluir: informe quando foi e se saiu como planejado, virou urgente ou foi disperso. É o que dá inteligência ao sistema.' },
    { sel:'#t-revisao', title:'5. Revisão semanal', text:'De sexta a domingo, faça a revisão: veja como foi e já planeje a próxima. Esse ritual é o segredo pra não largar.' },
    { sel:'#t-menu', title:'6. Seu menu', text:'Aqui você acessa Time, Meu Plano, configurações e tudo mais. Pronto — bom proveito! 🧭' },
  ];

  const spot = document.getElementById('spot');
  const pop = document.getElementById('pop');
  const arrow = document.getElementById('arrow');
  const screen = document.getElementById('screen');
  let i = 0;

  const dots = document.getElementById('dots');
  steps.forEach(()=>{ const d=document.createElement('i'); dots.appendChild(d); });

  function render(){
    const s = steps[i];
    const el = document.querySelector(s.sel);
    if(!el) return;

    // garante o alvo visível dentro do "celular"
    el.scrollIntoView({block:'center', behavior:'smooth'});

    setTimeout(()=>{
      const r = el.getBoundingClientRect();
      const pad = 8;
      spot.classList.remove('hidden');
      spot.style.left = (r.left - pad) + 'px';
      spot.style.top = (r.top - pad) + 'px';
      spot.style.width = (r.width + pad*2) + 'px';
      spot.style.height = (r.height + pad*2) + 'px';

      // texto
      document.getElementById('stepLbl').textContent = `Passo ${i+1} de ${steps.length}`;
      document.getElementById('popTitle').textContent = s.title;
      document.getElementById('popText').textContent = s.text;
      [...dots.children].forEach((d,idx)=> d.classList.toggle('on', idx<=i));
      document.getElementById('back').style.visibility = i===0 ? 'hidden' : 'visible';
      document.getElementById('next').textContent = i===steps.length-1 ? 'Concluir 🚀' : 'Avançar';

      // posiciona o balão acima ou abaixo do alvo
      pop.classList.remove('hidden');
      const ph = pop.offsetHeight, pw = pop.offsetWidth;
      const espacoAbaixo = window.innerHeight - r.bottom;
      let top, arrowTop;
      if(espacoAbaixo > ph + 24){ top = r.bottom + 14; arrowTop = -7; }
      else { top = r.top - ph - 14; arrowTop = ph - 7; }
      let left = r.left + r.width/2 - pw/2;
      left = Math.max(12, Math.min(left, window.innerWidth - pw - 12));
      pop.style.top = top + 'px';
      pop.style.left = left + 'px';
      const ax = r.left + r.width/2 - left - 7;
      arrow.style.left = Math.max(14, Math.min(ax, pw-28)) + 'px';
      arrow.style.top = arrowTop + 'px';
    }, 260);
  }

  function fim(){
    spot.classList.add('hidden');
    pop.classList.add('hidden');
    document.getElementById('restart').classList.remove('hidden');
  }

  document.getElementById('next').onclick = ()=>{ if(i<steps.length-1){ i++; render(); } else fim(); };
  document.getElementById('back').onclick = ()=>{ if(i>0){ i--; render(); } };
  document.getElementById('skip').onclick = fim;
  document.getElementById('restart').onclick = ()=>{ i=0; document.getElementById('restart').classList.add('hidden'); render(); };
  screen.addEventListener('scroll', ()=>{ if(!pop.classList.contains('hidden')) render(); });
  window.addEventListener('resize', ()=>{ if(!pop.classList.contains('hidden')) render(); });

  setTimeout(render, 500);
</script>
</body>
</html>
